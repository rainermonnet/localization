<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Executive Finder{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }

    nav {
      background: #0077b5;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      box-shadow: 0 2px 4px rgba(0,0,0,.15);
    }

    nav .brand { color: #fff; font-weight: 700; font-size: 1.1rem; text-decoration: none; }
    nav .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    nav a { color: rgba(255,255,255,.85); text-decoration: none; font-size: .9rem; }
    nav a:hover { color: #fff; }

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    h1 { font-size: 1.7rem; margin-bottom: .5rem; }
    h2 { font-size: 1.3rem; margin-bottom: 1rem; }
    p { line-height: 1.6; color: #444; }

    .btn {
      display: inline-block;
      padding: .55rem 1.2rem;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn-primary { background: #0077b5; color: #fff; }
    .btn-secondary { background: #e8f0fe; color: #1a1a2e; }
    .btn-sm { padding: .35rem .8rem; font-size: .82rem; }

    label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: .3rem; color: #333; }

    input[type=text], textarea, select {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    input[type=text]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0077b5;
      box-shadow: 0 0 0 3px rgba(0,119,181,.15);
    }

    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 4px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-gray { background: #f3f4f6; color: #374151; }

    .alert {
      padding: .75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: .9rem;
    }
    .alert-info { background: #eff6ff; color: #1d4ed8; border-left: 4px solid #3b82f6; }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="brand">Executive Finder</a>
    <div class="nav-links">
      {% if profile %}
        <a href="/dashboard">Suche</a>
        <span style="color:#fff;font-size:.85rem;">{{ profile.name }}</span>
        <a href="/auth/logout">Abmelden</a>
      {% else %}
        <a href="/auth/login">Mit LinkedIn anmelden</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
